<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Earn Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  min-height:100vh;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#111;
  position:relative;
  padding-bottom:85px;
}

/* Header */
.header{
  padding:18px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.balance{
  background:#292929;
  border:2px solid #704cff;
  border-radius:30px;
  padding:10px 18px;
  font-size:23px;
  font-weight:bold;
}

.balance span{
  color:#fff;
}

.earn{
  background:#303030;
  border-radius:25px;
  padding:8px 14px;
  font-size:14px;
}

.earn b{
  color:#7555ff;
}

/* Notice */
.notice{
  margin:5px 10px 12px;
  background:#242424;
  border-radius:20px;
  padding:10px;
  text-align:center;
  overflow:hidden;
}

.notice span{
  white-space:nowrap;
}

/* Video */
.video{
  height:600px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#222,#080808);
}

.video-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.video-content h2{
  font-size:25px;
  line-height:1.5;
}

.play{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#704cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin:auto auto 20px;
}

/* Task */
.task{
  position:absolute;
  right:15px;
  top:180px;
  text-align:center;
}

.task-icon{
  width:70px;
  height:70px;
  border-radius:50%;
  border:4px solid #ffe68a;
  background:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}

.task-number{
  font-size:22px;
  font-weight:bold;
  margin-top:8px;
}

.follow{
  margin-top:25px;
  font-size:28px;
}

.follow-text{
  font-size:15px;
  margin-top:5px;
}

/* Bottom */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:78px;
  background:#050505;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav{
  text-align:center;
  color:#aaa;
  font-size:13px;
}

.nav-icon{
  font-size:27px;
  margin-bottom:4px;
}

.nav.active{
  color:#7650ff;
}

/* Buttons */
.action{
  margin:15px;
  padding:15px;
  background:#704cff;
  border:0;
  border-radius:15px;
  color:white;
  width:calc(100% - 30px);
  font-size:18px;
  font-weight:bold;
}

.action:active{
  transform:scale(.98);
}

@media(max-width:360px){
  .balance{
    font-size:19px;
  }

  .earn{
    font-size:12px;
  }

  .video{
    height:520px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="balance">
      💵 ৳ <span id="balance">0.00</span>
    </div>

    <div class="earn">
      আরও <b>আয় করুন</b>
    </div>
  </div>

  <div class="notice">
    🔔 অভিনন্দন! নতুন টাস্ক এসেছে
  </div>

  <div class="video">

    <div class="video-content">
      <div>
        <div class="play">▶</div>
        <h2>
          ভিডিও দেখুন<br>
          এবং বৈধভাবে আয় করুন
        </h2>
      </div>
    </div>

    <div class="task">
      <div class="task-icon">💵</div>
      <div class="task-number">
        <span id="completed">0</span>/3
      </div>

      <div class="follow">♥</div>
      <div class="follow-text">ফলো</div>
    </div>

  </div>

  <button class="action" onclick="startTask()">
    🎬 টাস্ক শুরু করুন
  </button>

</div>

<div class="bottom">

  <div class="nav active">
    <div class="nav-icon">▤</div>
    এক্সপ্লোর
  </div>

  <div class="nav">
    <div class="nav-icon">🔎</div>
    শর্টস
  </div>

  <div class="nav">
    <div class="nav-icon">💵</div>
    পুরস্কার
  </div>

  <div class="nav">
    <div class="nav-icon">♡</div>
    প্রিয়
  </div>

  <div class="nav">
    <div class="nav-icon">♙</div>
    প্রোফাইল
  </div>

</div>

<script>

let balance = 0;
let completed = 0;

function startTask(){

  if(completed >= 3){
    alert("আজকের এই টাস্ক শেষ হয়েছে।");
    return;
  }

  alert(
    "টাস্ক শুরু হচ্ছে।\n\n" +
    "এখানে পরে আসল বৈধ earning source যুক্ত করা হবে।"
  );

  completed++;

  document.getElementById("completed").innerText = completed;
}

</script>

</body>
</html>
