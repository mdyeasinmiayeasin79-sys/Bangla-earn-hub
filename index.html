<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Earn Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  min-height:100vh;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#111;
  padding-bottom:95px;
}

/* Header */
.header{
  padding:18px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.balance{
  background:#292929;
  border:2px solid #704cff;
  border-radius:30px;
  padding:10px 18px;
  font-size:23px;
  font-weight:bold;
}

.earn{
  background:#303030;
  border-radius:25px;
  padding:9px 14px;
  font-size:14px;
}

.earn b{
  color:#8b70ff;
}

/* Notice */
.notice{
  margin:5px 10px 12px;
  background:#242424;
  border-radius:20px;
  padding:11px;
  text-align:center;
  overflow:hidden;
}

/* Video */
.video{
  height:500px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#252525,#080808);
  border-radius:0 0 20px 20px;
}

.video-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.video-content h2{
  font-size:24px;
  line-height:1.6;
}

.play{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#704cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin:0 auto 20px;
}

/* Task */
.task{
  position:absolute;
  right:15px;
  top:150px;
  text-align:center;
}

.task-icon{
  width:70px;
  height:70px;
  border-radius:50%;
  border:4px solid #ffe68a;
  background:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.task-number{
  font-size:22px;
  font-weight:bold;
  margin-top:8px;
}

.follow{
  margin-top:25px;
  font-size:28px;
  color:#ff4d7d;
}

.follow-text{
  font-size:15px;
  margin-top:5px;
}

/* Action */
.action{
  margin:15px;
  padding:15px;
  background:#704cff;
  border:0;
  border-radius:15px;
  color:white;
  width:calc(100% - 30px);
  font-size:18px;
  font-weight:bold;
}

.action:active{
  transform:scale(.98);
}

/* Timer */
.timer-box{
  display:none;
  margin:10px 15px;
  background:#242424;
  border-radius:15px;
  padding:15px;
  text-align:center;
}

.timer{
  font-size:30px;
  font-weight:bold;
  color:#8b70ff;
}

.message{
  margin-top:7px;
  font-size:14px;
  color:#ccc;
}

/* Bottom */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:78px;
  background:#050505;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav{
  text-align:center;
  color:#aaa;
  font-size:13px;
}

.nav-icon{
  font-size:26px;
  margin-bottom:4px;
}

.nav.active{
  color:#7650ff;
}

@media(max-width:360px){

  .balance{
    font-size:19px;
  }

  .earn{
    font-size:12px;
  }

  .video{
    height:460px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- Header -->
  <div class="header">

    <div class="balance">
      💵 ৳ <span id="balance">0.00</span>
    </div>

    <div class="earn">
      আরও <b>আয় করুন</b>
    </div>

  </div>

  <!-- Notice -->
  <div class="notice">
    🔔 অভিনন্দন! নতুন টাস্ক এসেছে
  </div>

  <!-- Video -->
  <div class="video">

    <div class="video-content">

      <div>

        <div class="play">
          ▶
        </div>

        <h2>
          ভিডিও দেখুন<br>
          এবং বৈধভাবে আয় করুন
        </h2>

      </div>

    </div>

    <!-- Task Counter -->
    <div class="task">

      <div class="task-icon">
        💵
      </div>

      <div class="task-number">
        <span id="completed">0</span>/3
      </div>

      <div class="follow">
        ♥
      </div>

      <div class="follow-text">
        ফলো
      </div>

    </div>

  </div>

  <!-- Timer -->
  <div class="timer-box" id="timerBox">

    <div class="timer">
      <span id="timer">10</span> সেকেন্ড
    </div>

    <div class="message" id="message">
      টাস্ক চলছে...
    </div>

  </div>

  <!-- Button -->
  <button
    class="action"
    id="taskButton"
    onclick="startTask()">
    🎬 টাস্ক শুরু করুন
  </button>

</div>


<!-- Bottom Navigation -->
<div class="bottom">

  <div class="nav active">
    <div class="nav-icon">▤</div>
    এক্সপ্লোর
  </div>

  <div class="nav">
    <div class="nav-icon">🔎</div>
    শর্টস
  </div>

  <div class="nav">
    <div class="nav-icon">💵</div>
    পুরস্কার
  </div>

  <div class="nav">
    <div class="nav-icon">♡</div>
    প্রিয়
  </div>

  <div class="nav">
    <div class="nav-icon">♙</div>
    প্রোফাইল
  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let balance =
  Number(localStorage.getItem("balance")) || 0;

let completed =
  Number(localStorage.getItem("completed")) || 0;

let running = false;


/* =========================
   DISPLAY
========================= */

function updateDisplay(){

  document.getElementById("balance").innerText =
    balance.toFixed(2);

  document.getElementById("completed").innerText =
    completed;

}


/* =========================
   START TASK
========================= */

function startTask(){

  if(running){
    return;
  }

  if(completed >= 3){

    alert(
      "আজকের ৩টি টাস্ক সম্পূর্ণ হয়েছে।"
    );

    return;
  }

  running = true;

  const button =
    document.getElementById("taskButton");

  const timerBox =
    document.getElementById("timerBox");

  const timer =
    document.getElementById("timer");

  const message =
    document.getElementById("message");

  timerBox.style.display = "block";

  button.disabled = true;

  button.innerText =
    "⏳ টাস্ক চলছে...";

  let time = 10;

  timer.innerText = time;

  message.innerText =
    "ভিডিও/টাস্কটি সম্পূর্ণ হওয়া পর্যন্ত অপেক্ষা করুন।";

  const interval =
    setInterval(function(){

      time--;

      timer.innerText = time;

      if(time <= 0){

        clearInterval(interval);

        finishTask();

      }

    },1000);

}


/* =========================
   FINISH TASK
========================= */

function finishTask(){

  completed++;

  /*
    ডেমো রিওয়ার্ড:
    প্রতিটি সম্পূর্ণ টাস্কে ৳1
  */

  balance += 1;

  localStorage.setItem(
    "balance",
    balance
  );

  localStorage.setItem(
    "completed",
    completed
  );

  updateDisplay();

  document.getElementById("timerBox")
    .style.display = "none";

  const button =
    document.getElementById("taskButton");

  button.disabled = false;

  if(completed >= 3){

    button.innerText =
      "✅ আজকের টাস্ক শেষ";

    alert(
      "অভিনন্দন! 🎉\n\n" +
      "আপনার ৩টি টাস্ক সম্পূর্ণ হয়েছে।\n" +
      "ডেমো রিওয়ার্ড যোগ হয়েছে: ৳3.00"
    );

  }else{

    button.innerText =
      "🎬 পরের টাস্ক শুরু করুন";

    alert(
      "টাস্ক সম্পূর্ণ হয়েছে! 🎉\n\n" +
      "আপনার ব্যালেন্সে ৳1.00 যোগ হয়েছে।"
    );

  }

  running = false;

}


/* =========================
   INITIAL LOAD
========================= */

updateDisplay();

</script>

</body>
  </html>
