<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Earn Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  min-height:100vh;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#111;
  padding-bottom:95px;
}

/* Header */
.header{
  padding:18px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.balance{
  background:#292929;
  border:2px solid #704cff;
  border-radius:30px;
  padding:10px 18px;
  font-size:23px;
  font-weight:bold;
}

.earn{
  background:#303030;
  border-radius:25px;
  padding:9px 14px;
  font-size:14px;
}

.earn b{
  color:#8b70ff;
}

/* Notice */
.notice{
  margin:5px 10px 12px;
  background:#242424;
  border-radius:20px;
  padding:11px;
  text-align:center;
  overflow:hidden;
}

/* Video */
.video{
  height:500px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#252525,#080808);
  border-radius:0 0 20px 20px;
}

.video-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.video-content h2{
  font-size:24px;
  line-height:1.6;
}

.play{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#704cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin:0 auto 20px;
}

/* Task */
.task{
  position:absolute;
  right:15px;
  top:150px;
  text-align:center;
}

.task-icon{
  width:70px;
  height:70px;
  border-radius:50%;
  border:4px solid #ffe68a;
  background:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.task-number{
  font-size:22px;
  font-weight:bold;
  margin-top:8px;
}

.follow{
  margin-top:25px;
  font-size:28px;
  color:#ff4d7d;
}

.follow-text{
  font-size:15px;
  margin-top:5px;
}

/* Action */
.action{
  margin:15px;
  padding:15px;
  background:#704cff;
  border:0;
  border-radius:15px;
  color:white;
  width:calc(100% - 30px);
