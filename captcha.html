<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bangla Earn Hub - CAPTCHA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #222;
}

.header {
  background: #1261c9;
  color: white;
  text-align: center;
  padding: 35px 20px;
}

.header h1 {
  margin: 0;
  font-size: 34px;
}

.header p {
  font-size: 18px;
  margin-top: 12px;
}

.card {
  max-width: 650px;
  margin: 35px auto;
  background: white;
  padding: 30px 25px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
  text-align: center;
}

.card h2 {
  color: #1261c9;
  margin-top: 0;
}

.card p {
  font-size: 17px;
  line-height: 1.6;
}

.captcha {
  margin: 25px 0;
  padding: 18px 15px;
  background: #edf2f7;
  color: #1261c9;
  border-radius: 12px;
  font-size: 38px;
  font-weight: bold;
  letter-spacing: 10px;
  user-select: none;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 20px;
  text-align: center;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #0752a8;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #063f82;
}

#message {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.6;
}

.next {
  display: none;
  margin-top: 20px;
  background: #198754;
}

.next:hover {
  background: #146c43;
}
</style>
</head>

<body>

<div class="header">
  <h1>Bangla Earn Hub</h1>
  <p>CAPTCHA Work</p>
</div>

<div class="card">

  <h2>CAPTCHA সম্পন্ন করুন</h2>

  <p>
    নিচের কোডটি দেখে একই কোডটি ঘরে লিখুন।
  </p>

  <div id="captcha" class="captcha"></div>

  <input
    type="text"
    id="answer"
    placeholder="ক্যাপচা কোড লিখুন"
    autocomplete="off"
  >

  <button onclick="checkCaptcha()">
    Submit
  </button>

  <div id="message"></div>

  <button
    id="nextButton"
    class="next"
    onclick="nextTask()">
    পরের কাজ
  </button>

</div>

<script>

let captchaCode = "";

function generateCaptcha() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  captchaCode = "";

  for (let i = 0; i < 5; i++) {

    captchaCode +=
      characters.charAt(
        Math.floor(
          Math.random() * characters.length
        )
      );

  }

  document.getElementById("captcha").innerText =
    captchaCode;
}


function checkCaptcha() {

  const answer =
    document.getElementById("answer")
    .value
    .trim()
    .toUpperCase();

  const message =
    document.getElementById("message");

  const nextButton =
    document.getElementById("nextButton");


  if (answer === captchaCode) {

    message.style.color = "green";

    message.innerHTML =
      "✅ CAPTCHA সঠিক হয়েছে!<br>" +
      "কাজটি সফলভাবে সম্পন্ন হয়েছে।";

    nextButton.style.display = "block";

    document.getElementById("answer").disabled = true;

  } else {

    message.style.color = "red";

    message.innerHTML =
      "❌ CAPTCHA ভুল হয়েছে। আবার চেষ্টা করুন।";

    generateCaptcha();

    document.getElementById("answer").value = "";

  }
}


function nextTask() {

  document.getElementById("message").style.color =
    "#1261c9";

  document.getElementById("message").innerHTML =
    "🎯 পরের কাজ শুরু করার জন্য প্রস্তুত।";

  document.getElementById("nextButton").innerText =
    "Task শুরু করুন";

  document.getElementById("answer").disabled =
    false;

  document.getElementById("answer").value =
    "";

  generateCaptcha();
}


generateCaptcha();

</script>

</body>
</html>
