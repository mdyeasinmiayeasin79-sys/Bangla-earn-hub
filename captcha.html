<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bangla Earn Hub - CAPTCHA</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5ff;
    color:#222;
}

.header{
    background:#1261c9;
    color:white;
    text-align:center;
    padding:55px 20px;
}

.header h1{
    margin:0;
    font-size:42px;
}

.header p{
    font-size:22px;
    margin-top:35px;
}

.card{
    max-width:650px;
    margin:70px auto;
    background:white;
    padding:40px 25px;
    border-radius:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

.card h2{
    color:#1261c9;
    font-size:32px;
}

.card p{
    font-size:20px;
    line-height:1.5;
}

.captcha{
    margin:30px 0;
    padding:35px 15px;
    background:#edf2f8;
    border-radius:18px;
    font-size:40px;
    font-weight:bold;
    letter-spacing:10px;
}

input{
    width:100%;
    padding:18px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:22px;
    text-align:center;
    margin-bottom:18px;
}

button{
    width:100%;
    padding:18px;
    border:0;
    border-radius:12px;
    background:#0752a8;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#063f82;
}

#message{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
    line-height:1.7;
}

.next{
    display:none;
    margin-top:20px;
    background:#159447;
}
</style>
</head>

<body>

<div class="header">
    <h1>Bangla Earn Hub</h1>
    <p>Captcha Work</p>
</div>

<div class="card">

    <h2>Solve the captcha</h2>

    <p>
        Look at the code below and enter it in the box.
    </p>

    <div id="captcha" class="captcha"></div>

    <input
        type="text"
        id="answer"
        placeholder="ক্যাপচা কোড লিখুন"
        autocomplete="off"
    >

    <button onclick="checkCaptcha()">
        Submit
    </button>

    <div id="message"></div>

    <button
        id="nextButton"
        class="next"
        onclick="nextTask()">
        পরের কাজ
    </button>

</div>

<script>
let captchaCode = "";

function generateCaptcha() {
    let characters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    captchaCode = "";

    for (let i = 0; i < 5; i++) {
        captchaCode += characters.charAt(
            Math.floor(Math.random() * characters.length)
        );
    }

    document.getElementById("captcha").innerText = captchaCode;
}

function checkCaptcha() {
    let answer = document
        .getElementById("answer")
        .value
        .trim()
        .toUpperCase();

    let message = document.getElementById("message");
    let nextButton = document.getElementById("nextButton");

    if (answer === captchaCode) {

        message.style.color = "green";

        message.innerHTML =
            "✅ সঠিক হয়েছে!<br>" +
            "🎉 CAPTCHA সফল হয়েছে!<br>" +
            "💰 Demo Reward: 5 টাকা";

        nextButton.style.display = "block";

        document.getElementById("answer").disabled = true;

    } else {

        message.style.color = "red";

        message.innerText =
            "❌ CAPTCHA ভুল হয়েছে। আবার চেষ্টা করুন।";
    }
}

function nextTask() {

    document.getElementById("message").style.color = "#1261c9";

    document.getElementById("message").innerHTML =
        "🎯 পরের Task শুরু হয়েছে!<br><br>" +
        "📺 YouTube ভিডিও দেখার Task<br>" +
        "ভিডিও সম্পূর্ণ দেখার পর কাজটি সম্পন্ন করুন।";

    document.getElementById("nextButton").innerText =
        "Task চলছে";

    generateCaptcha();
}
</script>
</body>
</html>
